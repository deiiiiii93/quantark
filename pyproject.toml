[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "quantark"
version = "0.1.0"
description = "Professional financial derivatives pricing library"
readme = "README.md"
requires-python = ">=3.10"
authors = [{ name = "QuantArk Team" }]
dependencies = [
    "numpy>=1.24.0",
    "scipy>=1.10.0",
    "pandas>=2.0.0",
    "matplotlib>=3.7.0",
    "seaborn>=0.12.0",
    "plotly>=5.14.0",
    "kaleido>=0.2.1",
    "pyarrow>=12.0.0",
    "openpyxl>=3.0.0",
    "pyyaml>=6.0.0",
    "python-docx>=1.0.0",
    "python-dateutil>=2.8.0",
]

[project.optional-dependencies]
dev = ["pytest>=7.0.0"]

[tool.hatch.build.targets.wheel]
packages = ["quantark"]

# Registers the legacy flat-import shim (quantark/_compat.py) at interpreter
# startup. Hatchling applies force-include to editable wheels too, so the
# shim is active for both `pip install` and `pip install -e`.
[tool.hatch.build.targets.wheel.force-include]
"quantark_compat.pth" = "quantark_compat.pth"

[tool.hatch.build.targets.sdist]
include = ["quantark", "quantark_compat.pth", "README.md"]
