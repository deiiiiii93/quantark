[pytest]
# Parallel test runs by default (suite is CPU-bound and parallel-safe).
# worksteal scheduling handles the wide test-duration spread (sub-ms unit
# tests next to 20s accuracy gates). Opt out for debugging (pdb, -s)
# with: pytest -n0 ...
addopts = -n auto --dist worksteal
testpaths = test
markers =
    slow: marks tests as slow (deselect with '-m "not slow"')
