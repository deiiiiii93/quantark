name: tests

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    env:
      QUANTARK_REQUIRE_MESH_KERNEL: python
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install
        run: pip install -e ".[dev]"
      - name: Run tests
        run: |
          # Two workers, not `-n auto` (4 on this runner): the numerics tests hold
          # multi-GB grids, and four of them at once exceeded the 16 GB runner, which
          # was shut down mid-suite. -rfE names every failure in the final summary.
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            python -m pytest -n 2 -rfE -m "not slow"
          else
            python -m pytest -n 2 -rfE
          fi

  accel:
    runs-on: ubuntu-latest
    env:
      QUANTARK_REQUIRE_MESH_KERNEL: numba
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Install
        run: pip install -e ".[dev,accel]"
      - name: Mesh kernel and 1D byte-sensitive tests
        run: |
          python -m pytest test/pde_grid test/pde_core test/modelvalidation/test_anchors.py \
            test/modelvalidation/test_banked_certificates.py test/execution -q

  package-smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Build
        run: |
          pip install build twine
          python -m build
          twine check dist/*
      - name: Install wheel in clean venv and smoke test
        run: |
          python -m venv /tmp/smoke
          /tmp/smoke/bin/pip install dist/*.whl
          cd /tmp
          /tmp/smoke/bin/python - <<'EOF'
          from datetime import datetime

          from quantark.backtest.replay import AutocallableBacktestDashboard
          from quantark.asset.equity.product.option import EuropeanVanillaOption
          from quantark.asset.equity.engine.analytical import BlackScholesEngine
          from quantark.param import SpotQuote, FlatVolSurface, FlatRateCurve, ContinuousDividendYield
          from quantark.priceenv import PricingEnvironment
          from quantark.util.enum import OptionType

          env = PricingEnvironment(
              spot_quote=SpotQuote(spot=100.0),
              vol_surface=FlatVolSurface(volatility=0.20),
              rate_curve=FlatRateCurve(rate=0.05),
              div_yield=ContinuousDividendYield(div_yield=0.02),
              valuation_date=datetime(2024, 1, 1),
          )
          opt = EuropeanVanillaOption(strike=100.0, maturity=1.0, option_type=OptionType.CALL)
          price = BlackScholesEngine().price(opt, env)
          assert 8.0 < price < 11.0, f"BS price out of range: {price}"
          print(f"smoke OK: {price:.6f}")
          EOF
